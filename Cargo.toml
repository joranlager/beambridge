[package]
name = "beambridge"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
clap = { version = "4.6.8", features = ["derive", "env"] }
dirs = "7.0.0"
getrandom = "0.4.3"
iroh = "1.4.1"
magic-wormhole = "0.8.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tun-rs = { version = "2.8.18", features = ["async"] }
